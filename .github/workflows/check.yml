
name: DTEK Telegram Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        run: python bot.py
